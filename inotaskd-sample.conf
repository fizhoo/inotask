# inotask sample configuration
#
# Copy this file to /etc/inotask/inotaskd.cfg for a system service, or to
# inotaskd.cfg for local development. Replace the example watch paths before
# starting the daemon; watch paths must exist when runtime watches are opened.
#
# Syntax notes:
# - # starts a comment outside a quoted string.
# - Paths and arguments are quoted strings.
# - Event and block names are identifiers without quotes.
# - Tasks and rules may appear in any order.

# A task defines one executable and its argv templates. inotask calls execv()
# directly; it does not insert a shell.
task report_event {
    exec = "/usr/bin/echo"
    args = [ "EVENT", "watch={watch_path}", "entry={entry_name}", "path={full_path}", "events={event}" ]
}

# The args field is optional when an executable needs no extra arguments.
task health_check {
    exec = "/usr/bin/true"
}

# Supported primitive event names match Linux inotify exactly:
# IN_ACCESS, IN_MODIFY, IN_ATTRIB, IN_CLOSE_WRITE, IN_CLOSE_NOWRITE,
# IN_OPEN, IN_MOVED_FROM, IN_MOVED_TO, IN_CREATE, IN_DELETE,
# IN_DELETE_SELF, and IN_MOVE_SELF.
#
# Linux aggregate masks are also accepted:
# - IN_CLOSE means IN_CLOSE_WRITE and IN_CLOSE_NOWRITE.
# - IN_MOVE means IN_MOVED_FROM and IN_MOVED_TO.
# - IN_ALL_EVENTS means every primitive event listed above.

# This rule demonstrates the common completed-file ingestion pattern.
rule completed_files {
    watch = "/srv/incoming"
    events = [ IN_CLOSE_WRITE, IN_MOVED_TO ]
    include = [ "*.csv", "*.json" ]
    exclude = [ ".*", "#*", "*.tmp", "*.swp" ]
    run = [ "report_event" ]
}

# Rules may share a watch path. Their masks are merged into one kernel watch,
# but matching, filters, settling, and task lists remain independent.
# settle_ms waits for the path to remain quiet before launching tasks.
rule changing_files {
    watch = "/srv/incoming"
    events = [ IN_MODIFY ]
    exclude = [ ".*", "#*", "*.tmp", "*.swp" ]
    settle_ms = 250
    run = [ "report_event", "health_check" ]
}

# A rule may use aggregate masks when all component events should match.
rule archive_changes {
    watch = "/srv/archive"
    events = [ IN_MOVE, IN_DELETE, IN_ATTRIB ]
    run = [ "report_event" ]
}
